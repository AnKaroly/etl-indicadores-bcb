[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etl-bcb"
version = "0.1.0"
description = "Pipeline ETL de indicadores econômicos do Banco Central (API SGS) para SQLite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
etl-bcb = "etl_bcb.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
